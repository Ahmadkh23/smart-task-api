{% extends 'base.html' %}

{% block title %}Dashboard - Smart Task Manager{% endblock %}

{% block extra_css %}
<style>
    .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
    }

    .dashboard-header h1 {
        font-size: 2rem;
        margin: 0;
    }

    .header-stats {
        display: flex;
        gap: 1rem;
    }

    .stat-card {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 1rem;
        border-radius: 0.5rem;
        text-align: center;
        min-width: 120px;
    }

    .stat-card.secondary {
        background: linear-gradient(135deg, var(--secondary) 0%, #4f46e5 100%);
    }

    .stat-number {
        font-size: 1.875rem;
        font-weight: 700;
    }

    .stat-label {
        font-size: 0.875rem;
        opacity: 0.9;
    }

    .task-input-section {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        padding: 1.5rem;
        border-radius: 0.5rem;
        margin-bottom: 2rem;
    }

    .task-input-group {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 1rem;
        align-items: end;
    }

    .task-input-group input,
    .task-input-group select {
        padding: 0.75rem;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        font-size: 1rem;
    }

    .task-input-group input {
        flex: 1;
    }

    .tasks-section {
        margin-top: 2rem;
    }

    .tasks-section h2 {
        font-size: 1.25rem;
        margin-bottom: 1rem;
        color: var(--text-main);
    }

    .task-filters {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
    }

    .filter-btn {
        padding: 0.5rem 1rem;
        border: 1px solid var(--border);
        background: var(--bg-panel);
        border-radius: 0.375rem;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
    }

    .filter-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
    }

    .tasks-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .task-item {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        padding: 1.25rem;
        border-radius: 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        transition: all 0.2s;
    }

    .task-item:hover {
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .task-item.completed {
        opacity: 0.6;
        background: #f9fafb;
    }

    .task-item.completed .task-title {
        text-decoration: line-through;
        color: var(--text-muted);
    }

    .task-item.priority-high {
        border-left-color: var(--danger);
    }

    .task-item.priority-high .priority-badge {
        background: #fee2e2;
        color: #991b1b;
    }

    .task-item.priority-medium {
        border-left-color: var(--warning);
    }

    .task-item.priority-medium .priority-badge {
        background: #fef3c7;
        color: #92400e;
    }

    .task-item.priority-low {
        border-left-color: var(--success);
    }

    .task-item.priority-low .priority-badge {
        background: #dcfce7;
        color: #166534;
    }

    .task-content {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .task-checkbox {
        width: 20px;
        height: 20px;
        cursor: pointer;
    }

    .task-info {
        flex: 1;
    }

    .task-title {
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 0.25rem;
    }

    .task-meta {
        font-size: 0.875rem;
        color: var(--text-muted);
    }

    .priority-badge {
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
    }

    .task-actions {
        display: flex;
        gap: 0.5rem;
    }

    .task-actions button {
        padding: 0.5rem 0.75rem;
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s;
    }

    .btn-delete {
        color: var(--danger);
    }

    .btn-delete:hover {
        background: #fee2e2;
        border-radius: 0.375rem;
    }

    .empty-state {
        background: var(--bg-panel);
        border: 2px dashed var(--border);
        border-radius: 0.5rem;
        padding: 3rem;
        text-align: center;
        color: var(--text-muted);
    }

    .empty-state-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
    }

    .empty-state h3 {
        font-size: 1.25rem;
        color: var(--text-main);
        margin-bottom: 0.5rem;
    }

    .loading {
        text-align: center;
        color: var(--text-muted);
        padding: 2rem;
    }

    .loading::after {
        content: '';
        animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
        0%, 20% { content: '.'; }
        40% { content: '..'; }
        60% { content: '...'; }
        100% { content ''; }
    }

    @media (max-width: 768px) {
        .dashboard-header {
            flex-direction: column;
            align-items: flex-start;
        }

        .header-stats {
            width: 100%;
            margin-top: 1rem;
        }

        .task-input-group {
            grid-template-columns: 1fr;
        }

        .task-item {
            flex-direction: column;
            align-items: flex-start;
        }

        .task-actions {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="dashboard-header">
    <div>
        <h1>📋 Dashboard</h1>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Organize and track your tasks efficiently</p>
    </div>
    <div class="header-stats">
        <div class="stat-card">
            <div class="stat-number" id="totalTasks">0</div>
            <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card secondary">
            <div class="stat-number" id="completedTasks">0</div>
            <div class="stat-label">Completed</div>
        </div>
    </div>
</div>

<div class="task-input-section">
    <form id="taskForm">
        {% csrf_token %}
        <div class="task-input-group">
            <input type="text" id="taskTitle" placeholder="Add a new task..." required>
            <select id="taskPriority">
                <option value="low">Low Priority</option>
                <option value="medium" selected>Medium Priority</option>
                <option value="high">High Priority</option>
            </select>
            <button type="submit" class="btn btn-primary">Add Task</button>
        </div>
    </form>
</div>

<div id="statusMessage"></div>

<div class="tasks-section">
    <div>
        <h2>Tasks</h2>
        <div class="task-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="high">High Priority</button>
        </div>
    </div>

    <div class="tasks-list" id="taskList"></div>
</div>

<script>
    const API_URL = '/api/tasks/';
    let allTasks = [];
    let currentFilter = 'all';

    function showMessage(text, type = 'info') {
        const msg = document.getElementById('statusMessage');
        msg.className = `message ${type}`;
        msg.textContent = text;
        msg.style.display = 'block';
        setTimeout(() => {
            msg.style.display = 'none';
        }, 3000);
    }

    function updateStats() {
        const total = allTasks.length;
        const completed = allTasks.filter(t => t.completed).length;
        document.getElementById('totalTasks').textContent = total;
        document.getElementById('completedTasks').textContent = completed;
    }

    function getFilteredTasks() {
        if (currentFilter === 'all') return allTasks;
        if (currentFilter === 'pending') return allTasks.filter(t => !t.completed);
        if (currentFilter === 'completed') return allTasks.filter(t => t.completed);
        if (currentFilter === 'high') return allTasks.filter(t => t.priority === 'high');
        return allTasks;
    }

    function renderTasks() {
        const taskList = document.getElementById('taskList');
        const filtered = getFilteredTasks();

        if (filtered.length === 0) {
            taskList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">✨</div>
                    <h3>No tasks yet</h3>
                    <p>Create your first task above to get started!</p>
                </div>
            `;
            return;
        }

        taskList.innerHTML = filtered.map(task => `
            <div class="task-item ${task.completed ? 'completed' : ''} priority-${task.priority}">
                <div class="task-content">
                    <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id}, ${!task.completed})">
                    <div class="task-info">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-meta">Created ${new Date(task.created_at).toLocaleDateString()}</div>
                    </div>
                    <span class="priority-badge">${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)}</span>
                </div>
                <div class="task-actions">
                    <button class="btn-delete" onclick="deleteTask(${task.id})">Delete</button>
                </div>
            </div>
        `).join('');
    }

    async function loadTasks() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Failed to load tasks');
            const data = await response.json();
            // Handle both paginated and non-paginated responses
            allTasks = Array.isArray(data) ? data : (data.results || []);
            updateStats();
            renderTasks();
        } catch (error) {
            showMessage('Failed to load tasks', 'error');
            console.error(error);
        }
    }

    async function addTask(e) {
        e.preventDefault();
        const title = document.getElementById('taskTitle').value.trim();
        const priority = document.getElementById('taskPriority').value;

        if (!title) return;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ title, priority, completed: false })
            });

            if (!response.ok) throw new Error('Failed to create task');
            document.getElementById('taskTitle').value = '';
            showMessage('Task created successfully!', 'success');
            loadTasks();
        } catch (error) {
            showMessage('Failed to create task', 'error');
            console.error(error);
        }
    }

    async function toggleTask(id, completed) {
        try {
            const response = await fetch(`${API_URL}${id}/`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ completed })
            });

            if (!response.ok) throw new Error('Failed to update task');
            loadTasks();
        } catch (error) {
            showMessage('Failed to update task', 'error');
            console.error(error);
        }
    }

    async function deleteTask(id) {
        if (!confirm('Are you sure you want to delete this task?')) return;

        try {
            const response = await fetch(`${API_URL}${id}/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            });

            if (!response.ok) throw new Error('Failed to delete task');
            showMessage('Task deleted', 'success');
            loadTasks();
        } catch (error) {
            showMessage('Failed to delete task', 'error');
            console.error(error);
        }
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    function getCookie(name) {
        let value = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.substring(0, name.length + 1) === name + '=') {
                    value = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return value;
    }

    // Event listeners
    document.getElementById('taskForm').addEventListener('submit', addTask);

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderTasks();
        });
    });

    // Initial load
    loadTasks();
</script>
{% endblock %}
