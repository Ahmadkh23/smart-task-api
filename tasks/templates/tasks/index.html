<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Dashboard</title>
    <style>
        :root {
            --bg-main: #f4f6f8;
            --bg-panel: #ffffff;
            --bg-soft: #eef2f5;
            --border: #d7dde3;
            --text-main: #172033;
            --text-muted: #637083;
            --accent: #0f766e;
            --accent-hover: #0b5f59;
            --danger: #dc2626;
            --success: #15803d;
            --warning: #b45309;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 32px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 980px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 6px;
        }

        .subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        #user-badge {
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--bg-panel);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }

        .btn,
        button {
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-panel);
            color: var(--text-main);
            padding: 0.7rem 1rem;
            font-size: 0.92rem;
            font-weight: 700;
            line-height: 1;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        .btn:hover,
        button:hover {
            background: var(--bg-soft);
            border-color: #b8c2cc;
            text-decoration: none;
        }

        .nav-form {
            margin: 0;
        }

        .task-form {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(23, 32, 51, 0.06);
        }

        .task-form input, .task-form select {
            min-height: 42px;
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .task-form input[type="text"] { flex: 1; }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: white;
        }

        .btn-secondary {
            background: #fff7ed;
            border-color: #fed7aa;
            color: #9a3412;
        }

        .btn-secondary:hover {
            background: #ffedd5;
            border-color: #fdba74;
            color: #7c2d12;
        }

        .task-list { display: flex; flex-direction: column; gap: 1rem; }

        .task-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-left: 5px solid var(--text-muted);
        }

        .task-card.high { border-left-color: var(--danger); }
        .task-card.medium { border-left-color: var(--warning); }
        .task-card.low { border-left-color: var(--success); }
        .task-info h3 { margin: 0 0 0.25rem 0; font-size: 1.1rem; }
        .task-info p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }
        .task-actions { display: flex; gap: 0.5rem; }

        .btn-action {
            min-height: 34px;
            padding: 0.5rem 0.8rem;
            font-size: 0.85rem;
        }

        .btn-done { color: var(--success); }
        .btn-delete { color: var(--danger); }

        .empty-state,
        .message {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            color: var(--text-muted);
        }

        .message.error {
            border-color: #fecaca;
            background: #fff1f2;
            color: #991b1b;
        }

        .inline-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        @media (max-width: 720px) {
            body { padding: 18px; }
            header,
            .status-row,
            .task-card {
                flex-direction: column;
                align-items: stretch;
            }
            .task-form {
                flex-direction: column;
            }
            .quick-actions,
            .task-actions {
                width: 100%;
            }
            .btn,
            button,
            .task-actions .btn-action {
                width: 100%;
            }
            #user-badge {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Smart Task Dashboard</h1>
                <p class="subtitle">Manage tasks, test the API, and move between project pages quickly.</p>
            </div>
            <span id="user-badge">Checking session...</span>
        </header>

        <nav class="quick-actions" aria-label="Main shortcuts">
            <a class="btn btn-primary" href="#taskForm">Create Task</a>
            <a class="btn" href="/api/">API Home</a>
            <a class="btn" href="/api/tasks/">Tasks API</a>
            <a class="btn" href="/admin/">Admin</a>
            {% if request.user.is_authenticated %}
                <form class="nav-form" action="/api-auth/logout/" method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="/">
                    <button class="btn btn-secondary" type="submit">Log Out</button>
                </form>
            {% else %}
                <a class="btn btn-secondary" href="/api-auth/login/?next=/">Log In</a>
                <a class="btn" href="/register/">Register</a>
            {% endif %}
        </nav>

        <form class="task-form" id="taskForm">
            <input type="text" id="taskTitle" placeholder="What needs to be done?" required>
            <select id="taskPriority">
                <option value="low">Low Priority</option>
                <option value="medium" selected>Medium Priority</option>
                <option value="high">High Priority</option>
            </select>
            <button type="submit" class="btn-primary">Add Task</button>
        </form>

        <div class="message" id="statusMessage" hidden></div>
        <div class="task-list" id="taskList"></div>
    </div>

    <script>
        const API_URL = '/api/tasks/';
        const taskList = document.getElementById('taskList');
        const statusMessage = document.getElementById('statusMessage');
        const userBadge = document.getElementById('user-badge');

        function showMessage(text, type = '') {
            statusMessage.textContent = text;
            statusMessage.className = `message ${type}`;
            statusMessage.hidden = !text;
        }

        async function loadTasks() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Not logged in');
                const data = await response.json();
                const tasks = Array.isArray(data) ? data : data.results || [];
                
                taskList.innerHTML = '';
                userBadge.innerText = 'Logged in';
                showMessage('');

                if (!tasks.length) {
                    taskList.innerHTML = `
                        <div class="empty-state">
                            No tasks yet. Add your first task above or open the API form.
                            <div class="inline-actions">
                                <a class="btn btn-primary" href="#taskForm">Create Task</a>
                                <a class="btn" href="/api/tasks/">Open Tasks API</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                tasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = `task-card ${task.priority.toLowerCase()}`;
                    card.innerHTML = `
                        <div class="task-info">
                            <h3 style="${task.completed ? 'text-decoration: line-through; color: var(--text-muted);' : ''}">${escapeHtml(task.title)}</h3>
                            <p>Priority: ${escapeHtml(task.priority.toUpperCase())}</p>
                        </div>
                        <div class="task-actions">
                            <button class="btn-action btn-done" onclick="toggleTask(${task.id}, ${task.completed})">
                                ${task.completed ? 'Undo' : 'Complete'}
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteTask(${task.id})">Delete</button>
                        </div>
                    `;
                    taskList.appendChild(card);
                });
            } catch (error) {
                taskList.innerHTML = `
                    <div class="message error">
                        Please log in before viewing or creating tasks.
                        <div class="inline-actions">
                            <a class="btn btn-primary" href="/api-auth/login/?next=/">Log In</a>
                            <a class="btn" href="/register/">Register</a>
                            <a class="btn" href="/api/tasks/">Open Tasks API</a>
                        </div>
                    </div>
                `;
                userBadge.innerText = 'Not logged in';
                showMessage('');
            }
        }

        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value;
            const priority = document.getElementById('taskPriority').value;

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                body: JSON.stringify({ title, priority })
            });

            if (!response.ok) {
                showMessage('Could not create the task. Log in first, then try again.', 'error');
                return;
            }

            document.getElementById('taskTitle').value = '';
            showMessage('Task created.');
            loadTasks();
        });

        async function toggleTask(id, currentState) {
            const response = await fetch(`${API_URL}${id}/`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                body: JSON.stringify({ completed: !currentState })
            });
            if (!response.ok) {
                showMessage('Could not update the task.', 'error');
                return;
            }
            loadTasks();
        }

        async function deleteTask(id) {
            if(confirm('Delete this task?')) {
                const response = await fetch(`${API_URL}${id}/`, {
                    method: 'DELETE',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }
                });
                if (!response.ok) {
                    showMessage('Could not delete the task.', 'error');
                    return;
                }
                showMessage('Task deleted.');
                loadTasks();
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        loadTasks();
    </script>
</body>
</html>
